<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Epoch &amp; Equinox — framed stream overlay</title>
<link rel="stylesheet" href="epoch-live.css">
<style>
  /* 1920x1080, full-screen: the whole canvas is dressed, with a hole cut
     for the game.

     The other two layouts float a few panels over your capture. This one
     replaces the background entirely -- a deep navy mat with a gilded
     picture frame around the play area and a rail of live stats beside
     it -- so the game sits in it like a painting rather than being
     covered up by it.

     The hole is real transparency: the mat is four panels around the
     opening, not one panel with a dark rectangle painted in it. Put the
     game capture BELOW this browser source in OBS and it shows through.

     Everything is driven by the six numbers below, so nudging the frame
     is a one-line edit. The default box is exactly 7x the Game Boy's
     160x144, which keeps flat mode pixel-crisp with no resampling. */
  :root {
    --box-x:52px;      /* left edge of the opening   */
    --box-y:36px;      /* top edge                   */
    --box-w:1120px;    /* 160 x 7                    */
    --box-h:1008px;    /* 144 x 7                    */
    --rail-x:1220px;   /* the stats column beside it */
    --rail-w:652px;
    --cam-x:1220px;    /* optional camera opening, 16:9 */
    --cam-y:560px;
    --cam-w:560px;
    --cam-h:315px;

    --ink:#F2F7FB;
    --dim:#9FB4C6;
    --cool:#9CC8E0;
    --warm:#F0B888;
    --panel:rgba(8,13,20,0.72);
    --line:rgba(156,200,224,0.28);
    --mat-edge:#141A33;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    width:1920px; height:1080px; overflow:hidden;
    background:transparent;
    font-family:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- the mat ----------------------------------------------------
     Four panels around the opening rather than one clipped panel: a
     clip-path or a mask that fails silently would paint over the game,
     and nobody notices that until they are live. Each panel carries the
     same 1920x1080 backdrop, shifted by its own offset, so the gradient
     runs across the seams as one image. */
  .mat {
    position:absolute;
    background-image:
      repeating-linear-gradient(135deg,
        rgba(255,239,192,.030) 0 2px, transparent 2px 11px),
      radial-gradient(120% 95% at 10% -10%,
        #222B52 0%, #182046 34%, #101733 62%, #080C1B 100%);
    background-size:1920px 1080px;
    background-repeat:no-repeat;
  }
  .mat.t { left:0; top:0; width:1920px; height:var(--box-y);
           background-position:0 0; }
  .mat.b { left:0; top:calc(var(--box-y) + var(--box-h));
           width:1920px; height:calc(1080px - var(--box-y) - var(--box-h));
           background-position:0 calc(-1 * (var(--box-y) + var(--box-h))); }
  .mat.l { left:0; top:var(--box-y); width:var(--box-x); height:var(--box-h);
           background-position:0 calc(-1 * var(--box-y)); }
  .mat.r { left:calc(var(--box-x) + var(--box-w)); top:var(--box-y);
           width:calc(1920px - var(--box-x) - var(--box-w)); height:var(--box-h);
           background-position:calc(-1 * (var(--box-x) + var(--box-w))) calc(-1 * var(--box-y)); }

  /* A second opening for a camera, off unless you ask for it: add ?cam
     to the URL. With it on, the single right-hand mat panel is replaced
     by four around the camera box -- same trick, one more hole. Off, the
     lower rail is simply empty, which is where a floating cam would go
     anyway. */
  .mat.cam { display:none; }
  body.cam-on .mat.r { display:none; }
  body.cam-on .mat.cam { display:block; }
  .mat.c1 { left:calc(var(--box-x) + var(--box-w)); top:var(--box-y);
            width:calc(1920px - var(--box-x) - var(--box-w));
            height:calc(var(--cam-y) - var(--box-y));
            background-position:calc(-1 * (var(--box-x) + var(--box-w))) calc(-1 * var(--box-y)); }
  .mat.c2 { left:calc(var(--box-x) + var(--box-w)); top:calc(var(--cam-y) + var(--cam-h));
            width:calc(1920px - var(--box-x) - var(--box-w));
            height:calc(var(--box-y) + var(--box-h) - var(--cam-y) - var(--cam-h));
            background-position:calc(-1 * (var(--box-x) + var(--box-w))) calc(-1 * (var(--cam-y) + var(--cam-h))); }
  .mat.c3 { left:calc(var(--box-x) + var(--box-w)); top:var(--cam-y);
            width:calc(var(--cam-x) - var(--box-x) - var(--box-w)); height:var(--cam-h);
            background-position:calc(-1 * (var(--box-x) + var(--box-w))) calc(-1 * var(--cam-y)); }
  .mat.c4 { left:calc(var(--cam-x) + var(--cam-w)); top:var(--cam-y);
            width:calc(1920px - var(--cam-x) - var(--cam-w)); height:var(--cam-h);
            background-position:calc(-1 * (var(--cam-x) + var(--cam-w))) calc(-1 * var(--cam-y)); }

  /* Scrollwork in the canvas corners, drawn faintly into the mat. */
  .corner { position:absolute; width:230px; height:230px; opacity:.16; }
  .corner.tl { left:0; top:0; }
  .corner.tr { right:0; top:0; transform:scaleX(-1); }
  .corner.bl { left:0; bottom:0; transform:scaleY(-1); }
  .corner.br { right:0; bottom:0; transform:scale(-1,-1); }

  /* ---- the frame ---------------------------------------------------
     Box-shadow spread rings only, which draw OUTSIDE the element -- so
     the frame is built entirely in the mat and never eats a pixel of
     the game. The one exception is the inset hairline, a single pixel
     of definition at the edge of the picture. */
  .frame {
    position:absolute;
    left:var(--box-x); top:var(--box-y);
    width:var(--box-w); height:var(--box-h);
    background:transparent;
    box-shadow:
      inset 0 0 0 1px rgba(255,239,192,.22),
      0 0 0 2px #6B5218,
      0 0 0 7px var(--gold),
      0 0 0 9px #7A5E1E,
      0 0 0 22px var(--mat-edge),
      0 0 0 24px var(--gold-dim),
      0 30px 80px rgba(0,0,0,.55);
  }
  /* Studs marching along the bevel band, top and bottom. */
  .frame .studs {
    position:absolute; opacity:.5;
    background-image:radial-gradient(circle,
      var(--gold) 0 1.7px, transparent 2.2px);
    background-size:44px 44px;
    background-position:center;
  }
  .frame .studs.t { left:-9px; right:-9px; top:-22px; height:13px; }
  .frame .studs.b { left:-9px; right:-9px; bottom:-22px; height:13px; }
  /* Corner cartouches sitting on the frame's outer corners. */
  .frame .orn { position:absolute; width:74px; height:74px; }
  .frame .orn.tl { left:-37px; top:-37px; }
  .frame .orn.tr { right:-37px; top:-37px; transform:scaleX(-1); }
  .frame .orn.bl { left:-37px; bottom:-37px; transform:scaleY(-1); }
  .frame .orn.br { right:-37px; bottom:-37px; transform:scale(-1,-1); }

  /* The camera's frame: the same rings, thinner, no studs. */
  .camframe {
    display:none; position:absolute;
    left:var(--cam-x); top:var(--cam-y);
    width:var(--cam-w); height:var(--cam-h);
    background:transparent;
    box-shadow:
      inset 0 0 0 1px rgba(255,239,192,.20),
      0 0 0 2px #6B5218,
      0 0 0 5px var(--gold),
      0 0 0 7px #7A5E1E,
      0 0 0 15px var(--mat-edge),
      0 0 0 17px var(--gold-dim),
      0 22px 60px rgba(0,0,0,.5);
  }
  body.cam-on .camframe { display:block; }
  .camframe .orn { position:absolute; width:52px; height:52px; }
  .camframe .orn.tl { left:-26px; top:-26px; }
  .camframe .orn.tr { right:-26px; top:-26px; transform:scaleX(-1); }
  .camframe .orn.bl { left:-26px; bottom:-26px; transform:scaleY(-1); }
  .camframe .orn.br { right:-26px; bottom:-26px; transform:scale(-1,-1); }

  /* ---- the rail ---------------------------------------------------- */
  .crest {
    position:absolute; left:var(--rail-x); top:var(--box-y); width:var(--rail-w);
    display:flex; align-items:center; gap:22px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 24px;
    box-shadow:0 16px 44px rgba(0,0,0,.45);
  }
  /* The emblem is the two covers as one split disc. Drop cover-ages.png
     and cover-seasons.png next to this file; without them the project's
     own mark underneath shows through, so nothing looks broken. */
  .emblem {
    position:relative; width:92px; height:92px; flex:0 0 auto;
    border-radius:50%; overflow:hidden;
    background:#0C1120;
    box-shadow:0 0 0 2px var(--gold-dim), 0 0 0 4px rgba(222,178,76,.22),
               0 8px 22px rgba(0,0,0,.5);
  }
  .emblem svg { position:absolute; inset:0; width:100%; height:100%; }
  .emblem i {
    position:absolute; inset:0; display:block;
    background-size:cover; background-position:center;
  }
  .emblem .a { clip-path:inset(0 50% 0 0); background-image:url("cover-ages.png"); }
  .emblem .b { clip-path:inset(0 0 0 50%); background-image:url("cover-seasons.png"); }
  .emblem .seam {
    position:absolute; left:50%; top:0; bottom:0; width:2px;
    transform:translateX(-1px);
    background:linear-gradient(180deg, var(--gold-lit), var(--gold-dim));
    opacity:.9;
  }
  .crest-text { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .name {
    font-size:29px; letter-spacing:.055em; color:var(--gold-lit);
    font-weight:600; line-height:1; white-space:nowrap;
  }
  .tag { font-size:15px; color:var(--dim); line-height:1.35; }
  .link {
    display:flex; align-items:center; gap:9px;
    font-size:16px; color:var(--cool); letter-spacing:.02em; line-height:1;
  }
  .link svg { width:16px; height:16px; fill:currentColor; opacity:.9; flex:0 0 auto; }

  .now {
    position:absolute; left:var(--rail-x); top:198px;
    max-width:var(--rail-w);
    display:flex; align-items:center; gap:12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px 22px 12px 18px;
    box-shadow:0 12px 32px rgba(0,0,0,.4);
  }
  .dot {
    width:9px; height:9px; border-radius:50%; background:var(--warm);
    flex:0 0 auto;
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow:0 0 0 0 rgba(240,184,136,.6); }
    70%  { box-shadow:0 0 0 14px rgba(240,184,136,0); }
    100% { box-shadow:0 0 0 0 rgba(240,184,136,0); }
  }
  .now-label { font-size:12px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }
  .now-text  { font-size:17px; letter-spacing:.02em; color:var(--ink); }
  @media (prefers-reduced-motion:reduce) { .dot { animation:none; } }

  /* Live panel and unlock card: look comes from epoch-live.css, only
     their place on the canvas is decided here. */
  .hud {
    left:var(--rail-x); top:266px; width:var(--rail-w);
    display:flex; flex-direction:column; gap:13px;
  }
  .hud-row { flex-wrap:wrap; gap:12px 20px; }
  .last {
    left:var(--rail-x); top:428px; width:var(--rail-w);
  }
  .card {
    left:var(--rail-x); bottom:var(--box-y); width:var(--rail-w);
  }
  @keyframes cardIn {
    0%   { opacity:0; transform:translateY(46px) scale(.97); }
    6%   { opacity:1; transform:translateY(0) scale(1); }
    88%  { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-16px) scale(.99); }
  }

  /* ---- alignment guide --------------------------------------------
     Prints the opening's exact rectangle over it, so the game capture
     can be typed straight into OBS's Transform box instead of dragged
     into place. Turned on from the launcher's Stream page, or with
     ?guide, or the G key; the label itself is filled in by
     epoch-live.js from the numbers above, so it cannot go stale. */
  .guide { position:absolute; inset:0; display:none; pointer-events:none; }
  body.guide-on .guide { display:block; }
  .guide .rect {
    position:absolute;
    left:var(--box-x); top:var(--box-y);
    width:var(--box-w); height:var(--box-h);
    border:2px dashed rgba(222,178,76,.85);
  }
  .guide .rect .tag, .guide .camrect .tag {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(10,14,28,.92); color:var(--gold-lit);
    border:1px solid var(--gold-dim); border-radius:6px;
    padding:12px 20px; font-size:18px; letter-spacing:.02em; white-space:nowrap;
  }
  .guide .camrect { display:none; }
  body.cam-on .guide .camrect {
    display:block; position:absolute;
    left:var(--cam-x); top:var(--cam-y);
    width:var(--cam-w); height:var(--cam-h);
    border:2px dashed rgba(222,178,76,.85);
  }
</style>
</head>
<body>

  <div class="mat t"></div>
  <div class="mat b"></div>
  <div class="mat l"></div>
  <div class="mat r"></div>
  <div class="mat cam c1"></div>
  <div class="mat cam c2"></div>
  <div class="mat cam c3"></div>
  <div class="mat cam c4"></div>

  <!-- Ornament stencils. Drawn geometry, like every other glyph here:
       one scroll for the canvas corners, one cartouche for the frame's,
       each placed four times and mirrored by CSS. -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="scroll" viewBox="0 0 120 120">
      <g fill="none" stroke="#DEB24C" stroke-width="2" stroke-linecap="round">
        <path d="M4 40 C4 18 18 4 40 4"/>
        <path d="M4 66 C4 32 32 4 66 4"/>
        <path d="M22 58 C22 38 38 22 58 22 C46 30 40 38 38 50 C34 62 26 66 22 58Z"
              fill="#DEB24C" fill-opacity=".22"/>
        <path d="M10 92 C34 84 84 34 92 10"/>
        <path d="M78 18 C88 22 96 30 100 40"/>
        <path d="M18 78 C22 88 30 96 40 100"/>
      </g>
      <circle cx="52" cy="52" r="3.4" fill="#DEB24C"/>
    </symbol>
    <symbol id="cartouche" viewBox="0 0 40 40">
      <path d="M20 2 34 20 20 38 6 20z" fill="#0E1428" stroke="#8A6C25" stroke-width="1.6"/>
      <path d="M20 7 29 20 20 33 11 20z" fill="#DEB24C"/>
      <path d="M20 11 26 20 20 29 14 20z" fill="#FFEFC0" opacity=".75"/>
    </symbol>
    <symbol id="medal" viewBox="0 0 64 64">
      <path d="M22 30 14 56l12-6 6 8" fill="#B22C30"/>
      <path d="M42 30 50 56l-12-6-6 8" fill="#B22C30"/>
      <circle cx="32" cy="26" r="17" fill="#D4AF37" stroke="#FFEBA0" stroke-width="2"/>
      <path d="M32 15 35.4 22.3 43 23.2 37.4 28.4 38.9 36 32 32.3 25.1 36 26.6 28.4 21 23.2 28.6 22.3z"
            fill="#8C6414"/>
    </symbol>
  </svg>

  <svg class="corner tl" aria-hidden="true"><use href="#scroll"/></svg>
  <svg class="corner tr" aria-hidden="true"><use href="#scroll"/></svg>
  <svg class="corner bl" aria-hidden="true"><use href="#scroll"/></svg>
  <svg class="corner br" aria-hidden="true"><use href="#scroll"/></svg>

  <div class="frame">
    <span class="studs t"></span>
    <span class="studs b"></span>
    <svg class="orn tl" aria-hidden="true"><use href="#cartouche"/></svg>
    <svg class="orn tr" aria-hidden="true"><use href="#cartouche"/></svg>
    <svg class="orn bl" aria-hidden="true"><use href="#cartouche"/></svg>
    <svg class="orn br" aria-hidden="true"><use href="#cartouche"/></svg>
  </div>

  <div class="camframe">
    <svg class="orn tl" aria-hidden="true"><use href="#cartouche"/></svg>
    <svg class="orn tr" aria-hidden="true"><use href="#cartouche"/></svg>
    <svg class="orn bl" aria-hidden="true"><use href="#cartouche"/></svg>
    <svg class="orn br" aria-hidden="true"><use href="#cartouche"/></svg>
  </div>

  <div class="crest">
    <div class="emblem" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9CC8E0"/>
            <stop offset="1" stop-color="#F0B888"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="20" fill="none" stroke="url(#g)" stroke-width="2.2"/>
        <path d="M24 4 L24 44" stroke="url(#g)" stroke-width="2.2"/>
        <path d="M24 4 A20 20 0 0 1 24 44 Z" fill="url(#g)" opacity=".28"/>
        <circle cx="24" cy="24" r="4.4" fill="url(#g)"/>
      </svg>
      <i class="a"></i><i class="b"></i><span class="seam"></span>
    </div>
    <div class="crest-text">
      <div class="name">EPOCH &amp; EQUINOX</div>
      <div class="tag">Oracle of Ages &amp; Seasons &middot; native player + mods</div>
      <div class="link">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38l-.01-1.49C3.8 14.16 3.34 12.9 3.34 12.9c-.36-.92-.88-1.16-.88-1.16-.72-.49.06-.48.06-.48.79.06 1.21.82 1.21.82.71 1.21 1.87.86 2.33.66.07-.52.28-.86.5-1.06-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 014 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.19c0 .21.15.46.55.38A8 8 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>github.com/ZakyPew/epoch-equinox</span>
      </div>
    </div>
  </div>

  <!-- Live state, hidden until the player writes stream/live.js. -->
  <div class="hud" id="hud" hidden>
    <i class="dia tl"></i><i class="dia tr"></i>
    <i class="dia bl"></i><i class="dia br"></i>

    <div class="hud-top">
      <span class="hud-game" id="hud-game">—</span>
      <span class="hud-room" id="hud-room">—</span>
      <span class="hud-linked" id="hud-linked" hidden>linked</span>
    </div>

    <div class="hud-row">
      <div class="stat">
        <span class="lbl">Essences</span>
        <span class="pips" id="pips"></span>
      </div>
      <div class="stat">
        <span class="lbl">Hearts</span>
        <span class="hearts" id="hearts"></span>
      </div>
    </div>

    <div class="hud-row">
      <div class="stat" title="Rings collected">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="9.5" r="5" fill="none" stroke="#DEB24C" stroke-width="1.6"/>
          <path d="M8 1.6 5.6 4.4h4.8z" fill="#9CC8E0"/>
        </svg>
        <span id="rings">0</span><span class="of">/64</span>
      </div>
      <div class="stat" title="Rupees">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.4 13 6l-5 8.6L3 6z" fill="#57C46A" stroke="#2E7A3B" stroke-width="1"/>
          <path d="M8 1.4 13 6H3z" fill="#8FE49C" opacity=".75"/>
        </svg>
        <span id="rupees">0</span>
      </div>
      <div class="stat" title="Deaths">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.8c3 0 5 2 5 4.6 0 1.8-1 2.6-1 4.1v1.2H4v-1.2C4 9 3 8.2 3 6.4 3 3.8 5 1.8 8 1.8z"
                fill="none" stroke="#9FB4C6" stroke-width="1.4"/>
          <circle cx="6.2" cy="6.6" r="1.2" fill="#9FB4C6"/>
          <circle cx="9.8" cy="6.6" r="1.2" fill="#9FB4C6"/>
        </svg>
        <span id="deaths">0</span>
      </div>
      <div class="stat" title="Play time">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6" fill="none" stroke="#9FB4C6" stroke-width="1.4"/>
          <path d="M8 4.4V8l2.6 1.6" fill="none" stroke="#9FB4C6"
                stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span id="time">0:00</span>
      </div>
    </div>

    <div class="hud-ach">
      <div class="ach-bar"><i id="ach-fill"></i></div>
      <span class="ach-text" id="ach-text">— / —</span>
    </div>
  </div>

  <!-- The most recent unlock, left standing between unlocks. -->
  <div class="last" id="last" hidden>
    <i class="dia tl"></i><i class="dia tr"></i>
    <i class="dia bl"></i><i class="dia br"></i>
    <span class="medal-slot">
      <svg class="medal" aria-hidden="true"><use href="#medal"/></svg>
      <img class="medal-img" id="last-icon" alt="" hidden>
    </span>
    <div>
      <div class="last-kicker">Last earned</div>
      <div class="last-title" id="last-title">—</div>
      <div class="last-desc" id="last-desc"></div>
    </div>
  </div>

  <div class="now">
    <span class="dot"></span>
    <span class="now-label">Building</span>
    <span class="now-text" id="now">the voxel renderer</span>
  </div>

  <!-- The unlock card, shown for a few seconds when one is earned. -->
  <div class="card" id="card">
    <i class="dia tl"></i><i class="dia tr"></i>
    <i class="dia bl"></i><i class="dia br"></i>
    <div class="card-sheen"></div>
    <span class="medal-slot">
      <svg class="medal" aria-hidden="true"><use href="#medal"/></svg>
      <img class="medal-img" id="card-icon" alt="" hidden>
    </span>
    <div>
      <div class="card-kicker">Achievement unlocked</div>
      <div class="card-title" id="card-title">—</div>
      <div class="card-desc" id="card-desc"></div>
    </div>
  </div>

  <div class="guide">
    <div class="rect"><span class="tag" id="guide-game"></span></div>
    <div class="camrect"><span class="tag" id="guide-cam"></span></div>
