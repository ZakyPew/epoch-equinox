<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Epoch &amp; Equinox — stream overlay</title>
<style>
  /* OBS Browser Source renders this at 1920x1080 over the scene, so the
     page itself must be transparent -- no body background. */
  :root {
    --ink:#F2F7FB;
    --dim:#9FB4C6;
    --cool:#9CC8E0;
    --warm:#F0B888;
    --panel:rgba(8,13,20,0.72);
    --line:rgba(156,200,224,0.28);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    width:1920px; height:1080px; overflow:hidden;
    background:transparent;
    font-family:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- lower-left identity bar ---------------------------------- */
  .bar {
    position:absolute; left:48px; bottom:48px;
    display:flex; align-items:stretch;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    backdrop-filter:blur(6px);
    overflow:hidden;
    box-shadow:0 18px 48px rgba(0,0,0,.45);
  }
  .mark {
    display:grid; place-items:center;
    padding:0 22px;
    background:linear-gradient(160deg, rgba(156,200,224,.16), rgba(240,184,136,.14));
    border-right:1px solid var(--line);
  }
  /* An hourglass for Ages and a four-season rosette for Seasons would
     both be someone else's art; this is the project's own glyph -- a
     split disc, the two games sharing one world. */
  .glyph { width:46px; height:46px; display:block; }

  .meta { padding:16px 26px 16px 22px; display:flex; flex-direction:column; gap:7px; }
  .name {
    font-size:27px; letter-spacing:.055em; color:var(--ink); font-weight:600;
    line-height:1;
  }
  .tag { font-size:14.5px; color:var(--dim); letter-spacing:.02em; line-height:1; }
  .link {
    display:flex; align-items:center; gap:9px;
    font-size:16px; color:var(--cool); letter-spacing:.03em; line-height:1;
  }
  .link svg { width:16px; height:16px; fill:currentColor; opacity:.9; }

  /* ---- top-right "now building" ticker --------------------------- */
  .now {
    position:absolute; right:48px; top:44px;
    display:flex; align-items:center; gap:12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px 22px 12px 18px;
    backdrop-filter:blur(6px);
    box-shadow:0 12px 32px rgba(0,0,0,.4);
  }
  .dot {
    width:9px; height:9px; border-radius:50%; background:var(--warm);
    box-shadow:0 0 0 0 rgba(240,184,136,.65);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow:0 0 0 0 rgba(240,184,136,.6); }
    70%  { box-shadow:0 0 0 14px rgba(240,184,136,0); }
    100% { box-shadow:0 0 0 0 rgba(240,184,136,0); }
  }
  .now-label { font-size:12px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }
  .now-text  { font-size:17px; letter-spacing:.02em; color:var(--ink); }

  @media (prefers-reduced-motion:reduce) { .dot { animation:none; } }
</style>
</head>
<body>

  <div class="bar">
    <div class="mark">
      <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9CC8E0"/>
            <stop offset="1" stop-color="#F0B888"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="20" fill="none" stroke="url(#g)" stroke-width="2.2"/>
        <path d="M24 4 L24 44" stroke="url(#g)" stroke-width="2.2"/>
        <path d="M24 4 A20 20 0 0 1 24 44 Z" fill="url(#g)" opacity=".28"/>
        <circle cx="24" cy="24" r="4.4" fill="url(#g)"/>
      </svg>
    </div>
    <div class="meta">
      <div class="name">EPOCH &amp; EQUINOX</div>
      <div class="tag">Oracle of Ages &amp; Seasons &middot; native player, mods, voxel mode</div>
      <div class="link">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38l-.01-1.49C3.8 14.16 3.34 12.9 3.34 12.9c-.36-.92-.88-1.16-.88-1.16-.72-.49.06-.48.06-.48.79.06 1.21.82 1.21.82.71 1.21 1.87.86 2.33.66.07-.52.28-.86.5-1.06-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 014 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.19c0 .21.15.46.55.38A8 8 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>github.com/ZakyPew/epoch-equinox</span>
      </div>
    </div>
  </div>

  <div class="now">
    <span class="dot"></span>
    <span class="now-label">Building</span>
    <span class="now-text" id="now">the voxel renderer</span>
  </div>

<script>
  /* Live status without fetch().
   *
   * OBS loads a local overlay over file://, and Chromium blocks fetch()
   * and XHR against file:// URLs -- so the obvious implementation fails
   * silently and the line never updates. Loading a <script> from the same
   * folder IS allowed, so the status lives in now.js as a one-line call:
   *
   *     NOW("making the trees stop looking like spikes");
   *
   * Re-injected every few seconds with a cache-buster. If now.js is
   * missing the default text just stays put. */
  window.NOW = function (t) {
    if (t) document.getElementById('now').textContent = t;
  };
  function poll() {
    var s = document.createElement('script');
    s.src = 'now.js?t=' + Date.now();
    s.onload = s.onerror = function () { s.remove(); };
    document.head.appendChild(s);
  }
  poll();
  setInterval(poll, 4000);
</script>
</body>
</html>
