<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Epoch &amp; Equinox — stream overlay</title>
<link rel="stylesheet" href="epoch-live.css">
<style>
  /* OBS Browser Source renders this at 1920x1080 over the scene, so the
     page itself must be transparent -- no body background. */
  :root {
    --ink:#F2F7FB;
    --dim:#9FB4C6;
    --cool:#9CC8E0;
    --warm:#F0B888;
    --panel:rgba(8,13,20,0.72);
    --line:rgba(156,200,224,0.28);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    width:1920px; height:1080px; overflow:hidden;
    background:transparent;
    font-family:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- lower-left identity bar ---------------------------------- */
  .bar {
    position:absolute; left:48px; bottom:48px;
    display:flex; align-items:stretch;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    backdrop-filter:blur(6px);
    overflow:hidden;
    box-shadow:0 18px 48px rgba(0,0,0,.45);
  }
  .mark {
    display:grid; place-items:center;
    padding:0 22px;
    background:linear-gradient(160deg, rgba(156,200,224,.16), rgba(240,184,136,.14));
    border-right:1px solid var(--line);
  }
  /* An hourglass for Ages and a four-season rosette for Seasons would
     both be someone else's art; this is the project's own glyph -- a
     split disc, the two games sharing one world. */
  .glyph { width:46px; height:46px; display:block; }

  .meta { padding:16px 26px 16px 22px; display:flex; flex-direction:column; gap:7px; }
  .name {
    font-size:27px; letter-spacing:.055em; color:var(--ink); font-weight:600;
    line-height:1;
  }
  .tag { font-size:14.5px; color:var(--dim); letter-spacing:.02em; line-height:1; }
  .link {
    display:flex; align-items:center; gap:9px;
    font-size:16px; color:var(--cool); letter-spacing:.03em; line-height:1;
  }
  .link svg { width:16px; height:16px; fill:currentColor; opacity:.9; }

  /* ---- top-right "now building" ticker --------------------------- */
  .now {
    position:absolute; right:48px; top:44px;
    display:flex; align-items:center; gap:12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px 22px 12px 18px;
    backdrop-filter:blur(6px);
    box-shadow:0 12px 32px rgba(0,0,0,.4);
  }
  .dot {
    width:9px; height:9px; border-radius:50%; background:var(--warm);
    box-shadow:0 0 0 0 rgba(240,184,136,.65);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow:0 0 0 0 rgba(240,184,136,.6); }
    70%  { box-shadow:0 0 0 14px rgba(240,184,136,0); }
    100% { box-shadow:0 0 0 0 rgba(240,184,136,0); }
  }
  .now-label { font-size:12px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }
  .now-text  { font-size:17px; letter-spacing:.02em; color:var(--ink); }

  @media (prefers-reduced-motion:reduce) { .dot { animation:none; } }


  .hud { left:48px; top:44px; min-width:430px; display:flex; flex-direction:column; gap:12px; }
  .hud-top { display:flex; align-items:center; gap:12px; }
  .card { right:48px; bottom:190px; min-width:520px; }
  @keyframes cardIn {
    0%   { opacity:0; transform:translateX(70px) scale(.97); }
    6%   { opacity:1; transform:translateX(0) scale(1); }
    88%  { opacity:1; transform:translateX(0) scale(1); }
    100% { opacity:0; transform:translateX(40px) scale(.99); }
  }

  /* The run blocks float like everything else here: the timer under the
     ticker, the inputs above the identity bar. */
  .timer  { position:absolute; right:48px; top:110px; min-width:300px; }
  .inputs { position:absolute; left:48px; bottom:224px; }
</style>
</head>
<body>

  <div class="bar">
    <div class="mark">
      <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9CC8E0"/>
            <stop offset="1" stop-color="#F0B888"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="20" fill="none" stroke="url(#g)" stroke-width="2.2"/>
        <path d="M24 4 L24 44" stroke="url(#g)" stroke-width="2.2"/>
        <path d="M24 4 A20 20 0 0 1 24 44 Z" fill="url(#g)" opacity=".28"/>
        <circle cx="24" cy="24" r="4.4" fill="url(#g)"/>
      </svg>
    </div>
    <div class="meta">
      <div class="name">EPOCH &amp; EQUINOX</div>
      <div class="tag">Oracle of Ages &amp; Seasons &middot; native player, mods, voxel mode</div>
      <div class="link">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38l-.01-1.49C3.8 14.16 3.34 12.9 3.34 12.9c-.36-.92-.88-1.16-.88-1.16-.72-.49.06-.48.06-.48.79.06 1.21.82 1.21.82.71 1.21 1.87.86 2.33.66.07-.52.28-.86.5-1.06-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 014 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.19c0 .21.15.46.55.38A8 8 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>github.com/ZakyPew/epoch-equinox</span>
      </div>
    </div>
  </div>

  <div class="now">
    <span class="dot"></span>
    <span class="now-label">Building</span>
    <span class="now-text" id="now">the voxel renderer</span>
  </div>


  <!-- Live state, hidden until the player writes stream/live.js. -->
  <div class="hud" id="hud" hidden>
    <i class="dia tl"></i><i class="dia tr"></i>
    <i class="dia bl"></i><i class="dia br"></i>

    <div class="hud-top">
      <span class="hud-game" id="hud-game">—</span>
      <span class="hud-room" id="hud-room">—</span>
      <span class="hud-linked" id="hud-linked" hidden>linked</span>
    </div>

    <div class="hud-row">
      <div class="stat">
        <span class="lbl">Essences</span>
        <span class="pips" id="pips"></span>
      </div>
      <div class="stat">
        <span class="lbl">Hearts</span>
        <span class="hearts" id="hearts"></span>
      </div>
    </div>

    <div class="hud-row">
      <div class="stat" title="Rings collected">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="9.5" r="5" fill="none" stroke="#DEB24C" stroke-width="1.6"/>
          <path d="M8 1.6 5.6 4.4h4.8z" fill="#9CC8E0"/>
        </svg>
        <span id="rings">0</span><span class="of">/64</span>
      </div>
      <div class="stat" title="Rupees">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.4 13 6l-5 8.6L3 6z" fill="#57C46A" stroke="#2E7A3B" stroke-width="1"/>
          <path d="M8 1.4 13 6H3z" fill="#8FE49C" opacity=".75"/>
        </svg>
        <span id="rupees">0</span>
      </div>
      <div class="stat" title="Deaths">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.8c3 0 5 2 5 4.6 0 1.8-1 2.6-1 4.1v1.2H4v-1.2C4 9 3 8.2 3 6.4 3 3.8 5 1.8 8 1.8z"
                fill="none" stroke="#9FB4C6" stroke-width="1.4"/>
          <circle cx="6.2" cy="6.6" r="1.2" fill="#9FB4C6"/>
          <circle cx="9.8" cy="6.6" r="1.2" fill="#9FB4C6"/>
        </svg>
        <span id="deaths">0</span>
      </div>
      <div class="stat" title="Play time">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6" fill="none" stroke="#9FB4C6" stroke-width="1.4"/>
          <path d="M8 4.4V8l2.6 1.6" fill="none" stroke="#9FB4C6"
                stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span id="time">0:00</span>
      </div>
    </div>

    <div class="hud-ach">
      <div class="ach-bar"><i id="ach-fill"></i></div>
      <span class="ach-text" id="ach-text">— / —</span>
    </div>
  </div>


  <!-- Speedrunning, hidden until switched on. The floating layouts take
       the two blocks that work over gameplay; the split list and the
       item grid need a rail, so they live in the framed pair. -->
  <div class="timer" id="timer" hidden>
    <div class="timer-label">File time</div>
    <div class="timer-value" id="timer-value">0:00<small>.00</small></div>
  </div>

  <div class="inputs" id="inputs" hidden>
    <span class="dpad">
      <i class="u" id="pad-u"></i><i class="d" id="pad-d"></i>
      <i class="l" id="pad-l"></i><i class="r" id="pad-r"></i>
    </span>
    <span class="face">
      <s id="pad-sel"></s><s id="pad-st"></s>
      <b id="pad-b">B</b><b id="pad-a">A</b>
    </span>
  </div>

  <!-- The unlock card, shown for a few seconds when one is earned. -->
  <div class="card" id="card">
    <i class="dia tl"></i><i class="dia tr"></i>
    <i class="dia bl"></i><i class="dia br"></i>
    <div class="card-sheen"></div>
    <span class="medal-slot">
      <svg class="medal" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M22 30 14 56l12-6 6 8" fill="#B22C30"/>
        <path d="M42 30 50 56l-12-6-6 8" fill="#B22C30"/>
        <circle cx="32" cy="26" r="17" fill="#D4AF37" stroke="#FFEBA0" stroke-width="2"/>
        <path d="M32 15 35.4 22.3 43 23.2 37.4 28.4 38.9 36 32 32.3 25.1 36 26.6 28.4 21 23.2 28.6 22.3z"
              fill="#8C6414"/>
      </svg>
      <img class="medal-img" id="card-icon" alt="" hidden>
    </span>
    <div>
      <div class="card-kicker">Achievement unlocked</div>
      <div class="card-title" id="card-title">—</div>
      <div class="card-desc" id="card-desc"></div>
    </div>
  </div>

<script src="epoch-live.js"></script>
</body>
</html>
