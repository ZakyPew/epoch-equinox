<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Epoch &amp; Equinox — vertical stream overlay</title>
<link rel="stylesheet" href="epoch-live.css">
<style>
  /* 1080x1920 for TikTok / Reels / Shorts / vertical Twitch.
     Transparent: OBS composites this over the scene.

     Two bands only, top and bottom, so the middle of the canvas stays
     clear for gameplay and a facecam. The bottom band is lifted clear of
     the caption strip those platforms draw over the last ~10% of the
     frame, and nothing sits in the right-hand column where the like and
     comment buttons live. */
  :root {
    --ink:#F4F8FC;
    --dim:#A6BACB;
    --cool:#9CC8E0;
    --warm:#F0B888;
    --panel:rgba(8,13,20,0.76);
    --line:rgba(156,200,224,0.30);

    --side-safe:150px;   /* clear of the right-hand button column */
    --bottom-safe:190px; /* clear of the caption strip */
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    width:1080px; height:1920px; overflow:hidden;
    background:transparent;
    font-family:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- top band --------------------------------------------------- */
  .top {
    position:absolute; top:34px; left:34px;
    right:var(--side-safe);
    display:flex; align-items:center; gap:20px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 26px;
    backdrop-filter:blur(6px);
    box-shadow:0 16px 44px rgba(0,0,0,.5);
  }
  /* The emblem is the two covers as one split disc -- Ages on the left,
     Seasons on the right. Drop cover-ages.png and cover-seasons.png next
     to this file; without them the gradient underneath shows through and
     nothing breaks. */
  .emblem {
    position:relative; width:96px; height:96px; flex:0 0 auto;
    border-radius:50%; overflow:hidden;
    background:linear-gradient(150deg,#9CC8E0,#F0B888);
    box-shadow:0 0 0 2px rgba(156,200,224,.45), 0 8px 20px rgba(0,0,0,.45);
  }
  .emblem i {
    position:absolute; inset:0; display:block;
    background-size:cover; background-position:center;
  }
  .emblem .a { clip-path:inset(0 50% 0 0); background-image:url("cover-ages.png"); }
  .emblem .b { clip-path:inset(0 0 0 50%); background-image:url("cover-seasons.png"); }
  .emblem::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.28));
  }
  .emblem .seam {
    position:absolute; left:50%; top:0; bottom:0; width:2px;
    transform:translateX(-1px);
    background:linear-gradient(180deg,#9CC8E0,#F0B888); opacity:.85;
    clip-path:none;
  }
  .top-text { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .name {
    font-size:36px; letter-spacing:.05em; color:var(--ink);
    font-weight:600; line-height:1; white-space:nowrap;
  }
  .tag {
    font-size:20px; color:var(--dim); line-height:1.25;
  }

  /* ---- bottom call to action -------------------------------------- */
  .cta {
    position:absolute;
    left:34px; right:var(--side-safe); bottom:var(--bottom-safe);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 30px;
    display:flex; flex-direction:column; gap:14px;
    backdrop-filter:blur(6px);
    box-shadow:0 18px 52px rgba(0,0,0,.55);
  }
  .cta-label {
    font-size:19px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--warm);
  }
  .link {
    display:flex; align-items:center; gap:16px;
    font-size:36px; color:var(--ink); letter-spacing:.01em;
    line-height:1.1; word-break:break-all;
  }
  .link svg { width:38px; height:38px; flex:0 0 auto; fill:var(--cool); }
  .link b { color:var(--cool); font-weight:600; }

  /* ---- now building pill ------------------------------------------ */
  .now {
    position:absolute; left:34px; bottom:calc(var(--bottom-safe) + 190px);
    display:flex; align-items:center; gap:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:14px 26px 14px 22px;
    backdrop-filter:blur(6px);
    max-width:calc(100% - 34px - var(--side-safe));
  }
  .dot {
    width:12px; height:12px; border-radius:50%; background:var(--warm);
    flex:0 0 auto;
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow:0 0 0 0 rgba(240,184,136,.6); }
    70%  { box-shadow:0 0 0 18px rgba(240,184,136,0); }
    100% { box-shadow:0 0 0 0 rgba(240,184,136,0); }
  }
  .now-text { font-size:24px; color:var(--ink); }
  @media (prefers-reduced-motion:reduce) { .dot { animation:none; } }


  /* The middle of a vertical canvas belongs to gameplay and a facecam,
     so the panel tucks under the header and the card sits above the
     caption strip -- both inside the platform-safe insets. */
  .hud {
    left:var(--side-safe, 40px); right:var(--side-safe, 40px);
    top:210px; display:flex; flex-direction:column; gap:13px;
  }
  .hud-top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .hud-row { flex-wrap:wrap; gap:14px 20px; }
  .card {
    left:var(--side-safe, 40px); right:var(--side-safe, 40px);
    bottom:calc(var(--bottom-safe, 320px) + 40px);
  }
  @keyframes cardIn {
    0%   { opacity:0; transform:translateY(38px) scale(.97); }
    6%   { opacity:1; transform:translateY(0) scale(1); }
    88%  { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-18px) scale(.99); }
  }
</style>
</head>
<body>

  <div class="top">
    <div class="emblem" aria-hidden="true">
      <i class="a"></i><i class="b"></i><span class="seam"></span>
    </div>
    <div class="top-text">
      <div class="name">EPOCH &amp; EQUINOX</div>
      <div class="tag">A Game Boy world rebuilt in 3D<br>from its own memory</div>
    </div>
  </div>

  <div class="now">
    <span class="dot"></span>
    <span class="now-text" id="now">building the voxel renderer</span>
  </div>

  <div class="cta">
    <div class="cta-label">Open source &middot; come help</div>
    <div class="link">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38l-.01-1.49C3.8 14.16 3.34 12.9 3.34 12.9c-.36-.92-.88-1.16-.88-1.16-.72-.49.06-.48.06-.48.79.06 1.21.82 1.21.82.71 1.21 1.87.86 2.33.66.07-.52.28-.86.5-1.06-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 014 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.19c0 .21.15.46.55.38A8 8 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>github.com/<b>ZakyPew/epoch-equinox</b></span>
    </div>
  </div>


  <!-- Live state, hidden until the player writes stream/live.js. -->
  <div class="hud" id="hud" hidden>
    <i class="dia tl"></i><i class="dia tr"></i>
    <i class="dia bl"></i><i class="dia br"></i>

    <div class="hud-top">
      <span class="hud-game" id="hud-game">—</span>
      <span class="hud-room" id="hud-room">—</span>
      <span class="hud-linked" id="hud-linked" hidden>linked</span>
    </div>

    <div class="hud-row">
      <div class="stat">
        <span class="lbl">Essences</span>
        <span class="pips" id="pips"></span>
      </div>
      <div class="stat">
        <span class="lbl">Hearts</span>
        <span class="hearts" id="hearts"></span>
      </div>
    </div>

    <div class="hud-row">
      <div class="stat" title="Rings collected">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="9.5" r="5" fill="none" stroke="#DEB24C" stroke-width="1.6"/>
          <path d="M8 1.6 5.6 4.4h4.8z" fill="#9CC8E0"/>
        </svg>
        <span id="rings">0</span><span class="of">/64</span>
      </div>
      <div class="stat" title="Rupees">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.4 13 6l-5 8.6L3 6z" fill="#57C46A" stroke="#2E7A3B" stroke-width="1"/>
          <path d="M8 1.4 13 6H3z" fill="#8FE49C" opacity=".75"/>
        </svg>
        <span id="rupees">0</span>
      </div>
      <div class="stat" title="Deaths">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.8c3 0 5 2 5 4.6 0 1.8-1 2.6-1 4.1v1.2H4v-1.2C4 9 3 8.2 3 6.4 3 3.8 5 1.8 8 1.8z"
                fill="none" stroke="#9FB4C6" stroke-width="1.4"/>
          <circle cx="6.2" cy="6.6" r="1.2" fill="#9FB4C6"/>
          <circle cx="9.8" cy="6.6" r="1.2" fill="#9FB4C6"/>
        </svg>
        <span id="deaths">0</span>
      </div>
      <div class="stat" title="Play time">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6" fill="none" stroke="#9FB4C6" stroke-width="1.4"/>
          <path d="M8 4.4V8l2.6 1.6" fill="none" stroke="#9FB4C6"
                stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span id="time">0:00</span>
      </div>
    </div>

    <div class="hud-ach">
      <div class="ach-bar"><i id="ach-fill"></i></div>
      <span class="ach-text" id="ach-text">— / —</span>
    </div>
  </div>

  <!-- The unlock card, shown for a few seconds when one is earned. -->
  <div class="card" id="card">
    <i class="dia tl"></i><i class="dia tr"></i>
    <i class="dia bl"></i><i class="dia br"></i>
    <div class="card-sheen"></div>
    <svg class="medal" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M22 30 14 56l12-6 6 8" fill="#B22C30"/>
      <path d="M42 30 50 56l-12-6-6 8" fill="#B22C30"/>
      <circle cx="32" cy="26" r="17" fill="#D4AF37" stroke="#FFEBA0" stroke-width="2"/>
      <path d="M32 15 35.4 22.3 43 23.2 37.4 28.4 38.9 36 32 32.3 25.1 36 26.6 28.4 21 23.2 28.6 22.3z"
            fill="#8C6414"/>
    </svg>
    <div>
      <div class="card-kicker">Achievement unlocked</div>
      <div class="card-title" id="card-title">—</div>
      <div class="card-desc" id="card-desc"></div>
    </div>
  </div>

<script src="epoch-live.js"></script>
</body>
</html>
