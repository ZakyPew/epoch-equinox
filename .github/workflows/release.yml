name: Release builds

# Builds the player for each platform. The binary contains no game code --
# it is an emulator that reads the user's own ROM at runtime -- so unlike
# earlier revisions of this project there is nothing here that cannot be
# distributed.
#
# Runs on version tags, and on demand from the Actions tab (workflow_dispatch)
# so a build can be produced without cutting a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # 24.04: the gb-recompiled runtime needs SDL >= 2.24 (controller type
    # enums); 22.04's libsdl2-dev is 2.0.20.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libcurl4-openssl-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/epoch --list-games
      # Stdlib only, no network: the updater's own checks, including a
      # download and install driven over a server on localhost.
      - name: Updater checks
        run: python3 tools/updater_test.py
      # The achievements engine against a synthetic WRAM buffer, plus a
      # parse of the shipped packs.
      - name: Achievements checks
        run: |
          cd build
          cc -O2 -o achievements_test ../tools/achievements_test.c -I ../src \
             -I _deps/gb_recompiled-src/runtime/include \
             $(sdl2-config --cflags) libepoch_support.a _gbrt_build/libgbrt.a \
             $(sdl2-config --libs) -lGL -lcurl -lm -lstdc++
          ./achievements_test
      - name: Package
        run: |
          staging=epoch-equinox-linux-x64
          mkdir -p "$staging/roms" "$staging/mods" "$staging/covers"
          cp build/epoch "$staging/"
          # The launcher reads cover art from covers/ next to the binary;
          # ship the repo's own art so the cards aren't blank on first run.
          cp -r art/covers/. "$staging/covers/"
          cp -r launcher "$staging/"
          cp -r achievements "$staging/"
          cp README.md LICENSE CREDITS.md "$staging/"
          cp examples/mods/README.md "$staging/mods/"
          printf 'Drop your ROMs here:\n  tlozooa.gbc  Oracle of Ages (USA, Australia)\n  tlozoos.gbc  Oracle of Seasons (USA, Australia)\nAny other .gb/.gbc works too.\n' > "$staging/roms/README.txt"
          tar czf "$staging.tar.gz" "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: epoch-equinox-linux-x64
          path: epoch-equinox-linux-x64.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (vcpkg is preinstalled on the runner)
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sdl2:x64-windows curl:x64-windows glew:x64-windows
      - name: Build
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Smoke test
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter epoch.exe | Select-Object -First 1
          & $exe.FullName --list-games
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build graphical launcher
        run: |
          python -m pip install PyInstaller PySide6-Essentials
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Epoch & Equinox Launcher" --paths launcher `
            launcher/epoch_launcher.py
      - name: Package
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter epoch.exe | Select-Object -First 1
          $staging = "epoch-equinox-windows-x64"
          New-Item -ItemType Directory -Force -Path "$staging/roms","$staging/mods","$staging/covers" | Out-Null
          # vcpkg applocal deployment puts the needed DLLs beside the exe.
          Copy-Item "$($exe.DirectoryName)\*" -Include *.exe,*.dll -Destination $staging
          # Ship the repo's cover art so the launcher cards aren't blank.
          Copy-Item "art/covers/*" -Destination "$staging/covers" -Recurse
          Copy-Item "dist\Epoch & Equinox Launcher.exe" $staging
          Copy-Item -Recurse launcher "$staging/launcher"
          Copy-Item -Recurse achievements "$staging/achievements"
          Copy-Item README.md,LICENSE,CREDITS.md $staging
          Copy-Item examples/mods/README.md "$staging/mods/"
          Set-Content "$staging/roms/README.txt" "Drop your ROMs here:`n  tlozooa.gbc  Oracle of Ages (USA, Australia)`n  tlozoos.gbc  Oracle of Seasons (USA, Australia)`nAny other .gb/.gbc works too."
          $launcherTest = Start-Process `
            -FilePath "$staging\Epoch & Equinox Launcher.exe" `
            -ArgumentList '--smoke-test' -Wait -PassThru
          if ($launcherTest.ExitCode -ne 0) { exit 1 }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: epoch-equinox-windows-x64
          path: epoch-equinox-windows-x64.zip

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Checkout first: it cleans the workspace, so running it after the
      # download would delete the artifacts we are about to upload.
      - uses: actions/checkout@v4
      # The launcher compares its own APP_VERSION against the release tags
      # to decide whether an update exists. If the two ever disagree the
      # updater goes quietly wrong -- either never offering an update or
      # offering one forever -- so refuse to publish the mismatch.
      - name: Version stamp matches the tag
        run: |
          stamped=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' launcher/epoch_launcher.py)
          echo "stamp v$stamped, tag $GITHUB_REF_NAME"
          if [ "v$stamped" != "$GITHUB_REF_NAME" ]; then
            echo "::error::launcher APP_VERSION is $stamped but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Hand-written notes win when the tag has them; otherwise fall back to
      # the standard blurb. Either way action-gh-release appends the
      # generated pull request list underneath.
      - name: Assemble release body
        run: |
          notes="docs/release-notes-${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "Using $notes"
            cp "$notes" release-body.md
          else
            echo "No $notes; falling back to the default blurb"
            cat > release-body.md <<'EOF'
          Prebuilt player. **No game data included** — drop your own ROMs
          into `roms/` next to the binary and run it. The optional launcher
          UI is `launcher/epoch_launcher.py` (needs Python + PySide6).
          EOF
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
          body_path: release-body.md
