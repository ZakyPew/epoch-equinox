name: Release builds

# Builds the player for each platform. The binary contains no game code --
# it is an emulator that reads the user's own ROM at runtime -- so unlike
# earlier revisions of this project there is nothing here that cannot be
# distributed.
#
# Runs on version tags, and on demand from the Actions tab (workflow_dispatch)
# so a build can be produced without cutting a release.

on:
  push:
    tags: ["v*"]
    # Build main on every merge too. The release job stays gated on a
    # tag, so this publishes nothing -- it exists because a Windows-only
    # compile error (MSVC and M_PI) sat unnoticed on main between
    # releases, and the first sign of it was a release build failing.
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Publish a release at this tag (e.g. v0.4.0). Leave empty to
          just build. The tag is created from the dispatched ref, so
          pushing one by hand is not required.
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  linux:
    # 24.04: the gb-recompiled runtime needs SDL >= 2.24 (controller type
    # enums); 22.04's libsdl2-dev is 2.0.20.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libcurl4-openssl-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/epoch --list-games
      # Stdlib only, no network: the updater's own checks, including a
      # download and install driven over a server on localhost.
      - name: Updater checks
        run: python3 tools/updater_test.py
      # The Oracle secret generator: encode/decode round trips, tamper
      # rejection, and (when a real save is present) ground-truth layout
      # checks. Stdlib only.

      # The achievements engine against a synthetic WRAM buffer, plus a
      # parse of the shipped packs.
      - name: Achievements, secrets, typist and camera checks
        run: |
          cd build
          for t in achievements_test secrets_c_test typist_test chasecam_test cliff_test stream_test; do
            cc -O2 -o $t ../tools/$t.c -I ../src \
               -I _deps/gb_recompiled-src/runtime/include \
               $(sdl2-config --cflags) libepoch_support.a _gbrt_build/libgbrt.a \
               $(sdl2-config --libs) -lGL -lcurl -lm -lstdc++
            ./$t
          done
          cd .. && python3 tools/secrets_test.py
      - name: Package
        run: |
          staging=epoch-equinox-linux-x64
          mkdir -p "$staging/roms" "$staging/mods" "$staging/covers"
          cp build/epoch "$staging/"
          # The launcher reads cover art from covers/ next to the binary;
          # ship the repo's own art so the cards aren't blank on first run.
          cp -r art/covers/. "$staging/covers/"
          cp -r launcher "$staging/"
          cp -r achievements "$staging/"
          # The stream overlays live beside the binary because the player
          # writes stream/live.js relative to its own working directory.
          cp -r stream "$staging/"
          cp README.md LICENSE CREDITS.md "$staging/"
          cp examples/mods/README.md "$staging/mods/"
          printf 'Drop your ROMs here:\n  tlozooa.gbc  Oracle of Ages (USA, Australia)\n  tlozoos.gbc  Oracle of Seasons (USA, Australia)\nAny other .gb/.gbc works too.\n' > "$staging/roms/README.txt"
          tar czf "$staging.tar.gz" "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: epoch-equinox-linux-x64
          path: epoch-equinox-linux-x64.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (vcpkg is preinstalled on the runner)
        run: |
          # Source archives occasionally return a transient 5xx from GitHub.
          # vcpkg retries an individual download, but still exits after three
          # quick attempts. Retrying the install preserves packages already
          # built on this runner and resumes at the failed dependency.
          # GitHub's /archive endpoint has also returned a sustained 503 for
          # EGL-Registry while codeload served the byte-identical tarball.
          # Seed that one verified archive under vcpkg's expected filename;
          # vcpkg will independently verify the port's SHA-512 before use.
          $eglName = 'KhronosGroup-EGL-Registry-3ae2b7c48690d2ce13cc6db3db02dfc0572be65e.tar.gz'
          $downloads = Join-Path $env:VCPKG_INSTALLATION_ROOT 'downloads'
          $eglArchive = Join-Path $downloads $eglName
          $eglPart = "$eglArchive.part"
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          Invoke-WebRequest `
            -Uri 'https://codeload.github.com/KhronosGroup/EGL-Registry/tar.gz/3ae2b7c48690d2ce13cc6db3db02dfc0572be65e' `
            -OutFile $eglPart
          $expectedSha256 = '00F6D5656D8A075EE72EC2CCBE9B803D29BB56695B05622AC4CDE95D760A1528'
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $eglPart).Hash
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -LiteralPath $eglPart -Force
            throw "unexpected EGL-Registry archive SHA-256: $actualSha256"
          }
          Move-Item -LiteralPath $eglPart -Destination $eglArchive -Force

          $packages = @(
            'sdl2:x64-windows',
            'curl:x64-windows',
            'glew:x64-windows'
          )
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install $packages
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) {
              throw "vcpkg install failed after $attempt attempts"
            }
            $delay = 15 * $attempt
            Write-Warning "vcpkg install failed; retrying in $delay seconds"
            Start-Sleep -Seconds $delay
          }
      - name: Build
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Smoke test
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter epoch.exe | Select-Object -First 1
          & $exe.FullName --list-games
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build graphical launcher
        run: |
          python -m pip install PyInstaller PySide6-Essentials
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Epoch & Equinox Launcher" --paths launcher `
            launcher/epoch_launcher.py
      - name: Package
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter epoch.exe | Select-Object -First 1
          $staging = "epoch-equinox-windows-x64"
          New-Item -ItemType Directory -Force -Path "$staging/roms","$staging/mods","$staging/covers" | Out-Null
          # vcpkg applocal deployment puts the needed DLLs beside the exe.
          Copy-Item "$($exe.DirectoryName)\*" -Include *.exe,*.dll -Destination $staging
          # Ship the repo's cover art so the launcher cards aren't blank.
          Copy-Item "art/covers/*" -Destination "$staging/covers" -Recurse
          Copy-Item "dist\Epoch & Equinox Launcher.exe" $staging
          Copy-Item -Recurse launcher "$staging/launcher"
          Copy-Item -Recurse achievements "$staging/achievements"
          # The player writes stream/live.js relative to its own working
          # directory, so the overlays ship beside it.
          Copy-Item -Recurse stream "$staging/stream"
          Copy-Item README.md,LICENSE,CREDITS.md $staging
          Copy-Item examples/mods/README.md "$staging/mods/"
          Set-Content "$staging/roms/README.txt" "Drop your ROMs here:`n  tlozooa.gbc  Oracle of Ages (USA, Australia)`n  tlozoos.gbc  Oracle of Seasons (USA, Australia)`nAny other .gb/.gbc works too."
          $launcherTest = Start-Process `
            -FilePath "$staging\Epoch & Equinox Launcher.exe" `
            -ArgumentList '--smoke-test' -Wait -PassThru
          if ($launcherTest.ExitCode -ne 0) { exit 1 }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: epoch-equinox-windows-x64
          path: epoch-equinox-windows-x64.zip

  macos:
    # macos-14 is Apple Silicon, matching the current supported Homebrew
    # runner and producing a native arm64 package for modern Macs.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          # SDL2's OpenGL ES wrapper includes Khronos GLES headers. macOS
          # supplies the OpenGL framework but not those headers, so Mesa is
          # used for the portable header set only.
          brew install cmake ninja sdl2 curl mesa
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2);$(brew --prefix curl);$(brew --prefix mesa)" \
            -DCMAKE_C_FLAGS="-I$(brew --prefix mesa)/include" \
            -DCMAKE_CXX_FLAGS="-I$(brew --prefix mesa)/include"
          cmake --build build --parallel
          ./build/epoch --list-games
      - name: Build graphical launcher
        run: |
          python3 -m venv .venv-macos
          source .venv-macos/bin/activate
          python -m pip install --upgrade pip
          python -m pip install PyInstaller PySide6-Essentials
          python -m PyInstaller --noconfirm --clean --windowed \
            --name "Epoch & Equinox Launcher" --paths launcher \
            launcher/epoch_launcher.py
      - name: Package
        run: |
          staging=epoch-equinox-macos-arm64
          mkdir -p "$staging/roms" "$staging/mods" "$staging/covers"
          cp build/epoch "$staging/"
          cp -r art/covers/. "$staging/covers/"
          cp -r launcher "$staging/"
          cp -r achievements "$staging/"
          cp -r stream "$staging/"
          cp -r "dist/Epoch & Equinox Launcher.app" "$staging/"
          cp README.md LICENSE CREDITS.md "$staging/"
          cp examples/mods/README.md "$staging/mods/"
          printf 'Drop your ROMs here:\n  tlozooa.gbc  Oracle of Ages (USA, Australia)\n  tlozoos.gbc  Oracle of Seasons (USA, Australia)\nAny other .gb/.gbc works too.\n' > "$staging/roms/README.txt"
          launcher_bin="$staging/Epoch & Equinox Launcher.app/Contents/MacOS/Epoch & Equinox Launcher"
          test -x "$launcher_bin"
          "$staging/epoch" --list-games
          COPYFILE_DISABLE=1 tar czf "$staging.tar.gz" "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: epoch-equinox-macos-arm64
          path: epoch-equinox-macos-arm64.tar.gz

  release:
    needs: [linux, windows, macos]
    # Either a pushed tag, or a dispatch that named one. The second path
    # exists because tags cannot always be pushed from a sandboxed
    # session; the workflow's own token can create them.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # Checkout first: it cleans the workspace, so running it after the
      # download would delete the artifacts we are about to upload.
      - uses: actions/checkout@v4
      # The launcher compares its own APP_VERSION against the release tags
      # to decide whether an update exists. If the two ever disagree the
      # updater goes quietly wrong -- either never offering an update or
      # offering one forever -- so refuse to publish the mismatch.
      - name: Resolve the tag and check the version stamp
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="$GITHUB_REF_NAME"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          stamped=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' launcher/epoch_launcher.py)
          echo "stamp v$stamped, tag $tag"
          if [ "v$stamped" != "$tag" ]; then
            echo "::error::launcher APP_VERSION is $stamped but the tag is $tag" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Hand-written notes win when the tag has them; otherwise fall back to
      # the standard blurb. Either way action-gh-release appends the
      # generated pull request list underneath.
      - name: Assemble release body
        run: |
          notes="docs/release-notes-${{ steps.tag.outputs.tag }}.md"
          if [ -f "$notes" ]; then
            echo "Using $notes"
            cp "$notes" release-body.md
          else
            echo "No $notes; falling back to the default blurb"
            cat > release-body.md <<'EOF'
          Prebuilt player. **No game data included** — drop your own ROMs
          into `roms/` next to the binary and run it. The optional launcher
          UI is `launcher/epoch_launcher.py` (needs Python + PySide6).
          EOF
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
          body_path: release-body.md
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ inputs.prerelease == true }}
