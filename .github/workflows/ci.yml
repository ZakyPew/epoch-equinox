name: CI

# Deliberately does NOT build the games, and publishes no binaries.
#
# Building a cart requires a ROM, and the resulting binary contains code
# translated from it. Neither belongs in CI or in a release artifact, so
# everyone recompiles from their own dump. What CI can do is check that our
# own code is sound.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Build the player
    # 24.04: the gb-recompiled runtime needs SDL >= 2.24 (controller type
    # enums); 22.04's libsdl2-dev is 2.0.20.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libcurl4-openssl-dev

      # The whole build -- no ROM involved anywhere, which is the point.
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Smoke test
        run: |
          test -x build/epoch
          ./build/epoch --list-games
          ./build/epoch --games-json | python3 -m json.tool > /dev/null
          echo "player builds and answers"

  launcher:
    name: Check the launcher
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          pip install -r launcher/requirements.txt

      - name: Byte-compile
        run: python -m compileall -q launcher tools

      # The stream overlays load the achievement icons as PNGs, because no
      # browser reads PAM. Those PNGs are a mirror of achievements/icons,
      # so a new or edited icon that never got mirrored would silently show
      # the fallback medal on stream instead.
      - name: Icon mirrors are current
        run: python3 tools/pam_to_png.py --check

      # The launcher's Stream page edits files a stream is reading live,
      # so its read/write round trips run against copies of the real
      # overlays -- geometry, switches, and the escaping on a status line
      # somebody types by hand.
      - name: Stream settings round trips
        run: python3 tools/stream_config_test.py

      # Save import/export replaces the one file a player cannot get
      # back, so its backup trail is proven against the real endgame
      # saves in tests/saves before any UI sits on top of it.
      - name: Save import/export round trips
        run: python3 tools/save_manager_test.py

      # The overlays are the part of this whose failures an audience
      # sees, and they were the part with no automated check -- a panel
      # that never hid itself shipped that way. Chromium loads them over
      # file:// here, the same way OBS does.
      - name: Overlays render
        run: |
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium
          python3 tools/overlay_render_test.py

      # Qt's offscreen platform constructs the whole UI headlessly, which
      # catches paint-path and signal-wiring breakage that a syntax check
      # would sail straight past.
      - name: Import under offscreen Qt
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "launcher")
          import gamepad, epoch_launcher
          print("launcher imports OK; pygame present:", gamepad._HAVE_PYGAME)
          EOF

  powershell:
    name: Lint setup.ps1 for Windows PowerShell 5.1
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # setup.ps1 must stay parseable by the PowerShell every Windows ships
      # with. A PS7-only operator once made it die before its first line,
      # with no message at all -- this job is why that cannot recur.
      - name: PSScriptAnalyzer, 5.1 target
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $settings = @{ Rules = @{ PSUseCompatibleSyntax = @{
            Enable = $true; TargetVersions = @('5.1','7.0') } } }
          $r = Invoke-ScriptAnalyzer -Path setup.ps1 -Settings $settings |
               Where-Object Severity -eq 'Error'
          if ($r) { $r | Format-List; exit 1 }
          Write-Host 'setup.ps1 is 5.1-clean'

  patches:
    name: Verify the runtime patches still apply
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Against the pinned runtime commit, not upstream HEAD -- HEAD is not
      # what we build. All three, in order: the Windows patch edits lines the
      # frame-hook patch inserted, so each must really apply before the next.
      - name: Apply chain against the pinned runtime commit
        run: |
          sha=$(sed -n 's/^set(GBRT_REF "\([0-9a-f]\{40\}\)".*/\1/p' CMakeLists.txt)
          test -n "$sha" || { echo "no pinned sha in CMakeLists.txt"; exit 1; }
          git init -q /tmp/gbrt
          git -C /tmp/gbrt fetch --depth 1 https://github.com/GB-Recomp/gb-recompiled.git "$sha"
          git -C /tmp/gbrt checkout -q FETCH_HEAD
          for p in gbrt-frame-hook gbrt-windows gbrt-host-menu gbrt-display-menu gbrt-hires-frame gbrt-audio-latency gbrt-host-overlay; do
            git -C /tmp/gbrt apply "$GITHUB_WORKSPACE/patches/$p.patch"
            echo "$p applies cleanly to $sha"
          done
